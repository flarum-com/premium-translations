karelialabs-translate:
  forum:
    written_in: "Written in {language}"
    translate_to: "Translate to {language}"
    translating: "Translating…"
    translated_from: "Translated from {language}"
    translated_by: "by {engine}"
    show_original: "Hide translation"
    show_translation: "Show translation"
    same_language: "This post is already in {language}."
    unknown_language: "another language"
    errors:
      budget: "The translation limit for this month has been reached. Ask an admin to raise it."
      rate: "You have translated a lot in the last hour. Try again later."
      engine: "The translation service did not answer. Try again later."
      unavailable: "This post cannot be translated."
      target: "Your language could not be recognised."
      default: "The translation failed. Try again later."

  admin:
    permissions:
      translate_label: "Translate posts"
    settings:
      intro: "Choose a translation service and paste its API key. Translations are saved, so each post is translated only once per language. Code, web addresses and @mentions are never sent."
      engine_label: "Translation service"
      engine_help: "DeepL gives the best quality for European languages and has a free plan of 500,000 characters a month. LibreTranslate and local models (LM Studio, Ollama) are free and keep all text on your own server."
      engine_options:
        deepl: "DeepL"
        google: "Google Cloud Translation"
        openai: "OpenAI-compatible (OpenAI, Mistral, Gemini, DeepSeek, OpenRouter, LM Studio, Ollama)"
        anthropic: "Anthropic Claude"
        libretranslate: "LibreTranslate (self-hosted)"
      deepl_key_label: "DeepL API key"
      deepl_key_help: "Free plan keys end with :fx and work too."
      google_key_label: "Google Cloud API key"
      google_key_help: "A key with the Cloud Translation API enabled."
      openai_base_url_label: "OpenAI-compatible address"
      openai_base_url_help: "OpenAI: https://api.openai.com/v1 · Mistral: https://api.mistral.ai/v1 · Gemini: https://generativelanguage.googleapis.com/v1beta/openai · OpenRouter: https://openrouter.ai/api/v1 · LM Studio on the same server: http://127.0.0.1:1234/v1"
      openai_key_label: "API key"
      openai_key_help: "Leave empty for a local model that does not need a key."
      openai_model_label: "Model name"
      openai_model_help: "Exactly as the service names it, for example a small, fast model. Translation does not need the largest model."
      openai_no_thinking_label: "Turn off model thinking"
      openai_no_thinking_help: "Turn on for local reasoning models (for example Gemma or Qwen in LM Studio) if translations come back empty."
      anthropic_key_label: "Anthropic API key"
      anthropic_model_label: "Claude model"
      anthropic_model_help: "Default: claude-haiku-5-5, the cheapest and good enough for translation. claude-sonnet-5-5 or claude-opus-5-5 give the finest tone at a higher price."
      libretranslate_url_label: "LibreTranslate address"
      libretranslate_url_help: "For example http://127.0.0.1:5000"
      libretranslate_key_label: "LibreTranslate API key"
      libretranslate_key_help: "Only if your LibreTranslate server requires one."
      target_mode_label: "Translate into"
      target_mode_options:
        locale: "The reader's forum language"
        browser: "The reader's browser language"
      target_mode_help: "With only one language pack installed, \"browser language\" lets readers translate into their own language anyway."
      monthly_char_limit_label: "Character limit per month"
      monthly_char_limit_help: "Translation stops for the rest of the month when the limit is reached. 0 means no limit."
      hourly_user_limit_label: "New translations per reader per hour"
      hourly_user_limit_help: "Translations that are already saved do not count. Admins have no limit. 0 means no limit."
      show_unknown_label: "Offer translation when the language is unknown"
      show_unknown_help: "Very short posts often have no detected language. Turn on to show the button on them too."
      glossary_label: "Never translate"
      glossary_help: "One word or name per line, for example your forum's name or product names."
    status:
      heading: "Status"
      usage: "Used this month: {used} of {limit} characters"
      usage_unlimited: "Used this month: {used} characters (no limit)"
      test_button: "Test the connection"
      test_ok: "It works ({ms} ms, {engine}):"
      test_failed: "It does not work yet:"
      save_first: "Save your settings before you test."
      detect_hint: "To find the language of posts written before you installed the extension, run: php flarum karelia-translate:detect"
